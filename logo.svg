<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1a5c38"/>
      <stop offset="100%" stop-color="#0d3320"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#g)" stroke="#28a745" stroke-width="3"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Shuttlecock body / cork -->
  <ellipse cx="100" cy="130" rx="26" ry="18" fill="#2d7a4f" stroke="#14472e" stroke-width="1.5"/>

  <!-- Cork band -->
  <ellipse cx="100" cy="124" rx="26" ry="7" fill="none" stroke="#14472e" stroke-width="1.5"/>
  <line x1="74" y1="127" x2="126" y2="127" stroke="#14472e" stroke-width="1" opacity="0.5"/>

  <!-- Feathers -->
  <!-- Left -->
  <line x1="100" y1="116" x2="62" y2="48" stroke="#4ecb71" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="100" y1="116" x2="138" y2="48" stroke="#4ecb71" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top -->
  <line x1="100" y1="116" x2="100" y2="42"  stroke="#4ecb71" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Mid-left -->
  <line x1="100" y1="116" x2="58"  y2="68"  stroke="#3ab85e" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Mid-right -->
  <line x1="100" y1="116" x2="142" y2="68"  stroke="#3ab85e" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Extra left -->
  <line x1="100" y1="116" x2="80"  y2="46"  stroke="#3ab85e" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Extra right -->
  <line x1="100" y1="116" x2="120" y2="46"  stroke="#3ab85e" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Feather barbs on top feather -->
  <!-- barb pairs every 6px along left feather -->
  <line x1="100" y1="116" x2="100" y2="42" stroke="#2d8a4f" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- Tip crown ring -->
  <ellipse cx="100" cy="41"  rx="9" ry="5" fill="#14472e"/>
  <ellipse cx="62"  cy="47"  rx="6" ry="3.5" fill="#14472e"/>
  <ellipse cx="138" cy="47"  rx="6" ry="3.5" fill="#14472e"/>
  <ellipse cx="58"  cy="67"  rx="5" ry="3"   fill="#14472e" opacity="0.8"/>
  <ellipse cx="142" cy="67"  rx="5" ry="3"   fill="#14472e" opacity="0.8"/>

  <!-- Centre highlight -->
  <ellipse cx="100" cy="130" rx="10" ry="6" fill="rgba(255,255,255,0.18)"/>

  <!-- Club initials -->
  <text x="100" y="176" font-family="Georgia, serif" font-size="22" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.9" letter-spacing="1">CBC</text>
</svg>
